[project]
name = "learner-backend"
version = "0.1.0"
description = "Verified learning app backend — deterministic verification harness that forces low hallucination."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20",
    "greenlet>=3.1",
    "alembic>=1.14",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "structlog>=24.4",
    "fastembed>=0.4",
    "numpy>=1.26",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]
postgres = [
    "asyncpg>=0.30",
]

[project.scripts]
learner = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
# 3.12 target so modern dependency stubs (numpy) type-check; the app runs on 3.11+.
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
# Pragmatic: type-check bodies and catch real mismatches, without demanding an
# annotation on every inner/lambda. Enforced in CI (no `|| true`).
check_untyped_defs = true
warn_unused_ignores = false
